<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KF Fact-Check Review Desk</title>
<meta name="description" content="Expert review of AI translations flagged by the KF fact-check: Tibetan, Sanskrit and commentary evidence beside each translation, in English, Chinese and Hindi.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f3558'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c79a3a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c79a3a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+Tibetan:wght@400;600&family=Noto+Serif+TC:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="16" cy="16" r="13.5"/><circle cx="16" cy="16" r="4.2" fill="currentColor" stroke="none"/>
        <g stroke-linecap="round"><path d="M16 2.5v9.3M16 20.2v9.3M2.5 16h9.3M20.2 16h9.3M6.5 6.5l6.6 6.6M18.9 18.9l6.6 6.6M25.5 6.5l-6.6 6.6M13.1 18.9l-6.6 6.6"/></g>
      </svg>
      <div><h1 id="t-app"></h1><small id="t-sub"></small></div>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Review language">
      <button data-lang="en" aria-pressed="false">English</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
      <button data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>
    <div class="tools">
      <span class="sync" id="sync" role="status" aria-live="polite" hidden></span>
      <input class="who" id="who" type="text" maxlength="60" autocomplete="name">
      <button class="ghost" id="b-export"></button>
      <button class="ghost" id="b-help"></button>
      <button class="ghost" id="b-theme" title="Theme">◐</button>
    </div>
  </header>
  <div class="layout" id="layout" data-view="list">
    <aside class="rail">
      <div class="summary" id="summary"></div>
      <div class="filters" id="filters"></div>
      <div class="count" id="count"></div>
      <div class="list" id="list" role="list"></div>
    </aside>
    <main class="stage" id="stage"><div class="loading" id="loading"></div></main>
  </div>
</div>
<div id="overlay"></div>
<script src="config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
